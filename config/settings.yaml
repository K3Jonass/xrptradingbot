app:
  symbol: XRPUSDT
  allowed_symbols:
    - XRPUSDT
  supported_intervals:
    - 1m
    - 5m
    - 15m
    - 1h
    - 4h
  default_interval: 15m
  candle_limit:
    default: 500
    min: 60
    max: 1000

indicator_settings:
  ema_fast: 20
  ema_slow: 50
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bollinger_period: 20
  bollinger_std_dev: 2
  volume_ma_period: 20
  atr_period: 14
  adx_period: 14

analysis:
  trend_rsi_midpoint: 50
  overbought_rsi: 70
  oversold_rsi: 30
  volume_breakout_threshold: 1.5
  adx_trend_threshold: 25
  high_volatility_atr_ratio: 0.035
  low_volatility_atr_ratio: 0.01
  support_resistance_lookback: 30
  sr_proximity_pct: 0.015
  atr_stop_loss_multiple: 1.5
  atr_take_profit_multiple: 3.0

network:
  timeout_seconds: 10
  retries: 3
